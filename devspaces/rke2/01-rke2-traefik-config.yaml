# Copy to /var/lib/rancher/rke2/server/manifests/rke2-traefik-config.yaml on a
# server node. RKE2 re-applies the bundled rke2-traefik chart with these values.
#
# Static CLI arguments are used instead of chart values so the file keeps
# working across rke2-traefik chart versions.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      # Redirect all HTTP traffic to HTTPS (replaces nginx "ssl-redirect").
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
      # Long-lived connections for the IDE websockets and language servers
      # (replaces nginx "proxy-read-timeout: 3600"). Traefik v3 defaults the
      # read timeout to 60s, which drops idle editor sessions.
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=3600s"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=3600s"
      - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=3600s"
